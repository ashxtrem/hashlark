[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/ashxtrem/hashlark"
homepage = "https://github.com/ashxtrem/hashlark"
authors = ["Hashlark contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Android libraries keep their symbol table so `uniffi-bindgen` can read the
# binding metadata from them; the Android Gradle plugin strips them when it
# packages the APK. They are optimised for size, as the built-in torrent client
# would otherwise push the library past the per-ABI APK budget. `panic` stays
# `unwind`: UniFFI turns a panic in a call into an error with `catch_unwind`.
[profile.android]
inherits = "release"
opt-level = "s"
strip = "none"
