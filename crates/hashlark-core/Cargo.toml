[package]
name = "hashlark-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
arti-client = { version = "0.46.0", default-features = false, features = ["tokio", "rustls", "compression", "onion-service-client", "static-sqlite"], optional = true }
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
data-encoding = "2.11.1"
directories = "6.0.0"
ed25519-dalek = "3.0.0"
encoding_rs = "0.8.42"
getrandom = "0.4.3"
governor = "0.10.4"
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"], optional = true }
minijinja = { version = "2.24.0", features = ["urlencode", "fuel", "json", "loader"] }
notify = "8.2.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "gzip", "brotli", "rustls", "charset", "http2", "query", "form", "cookies", "socks"] }
roxmltree = "0.21.1"
schemars = { version = "1.2.2", optional = true }
scraper = { version = "0.27.0", default-features = false, features = ["errors"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.3.0"
serde_json = "1.0.151"
serde_json_path = "0.7.2"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
strsim = "0.11.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "parsing", "formatting", "macros"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
tokio-util = "0.7.19"
tor-rtcompat = { version = "0.46.0", default-features = false, features = ["tokio", "rustls"], optional = true }
tracing = "0.1.44"
url = { version = "2.5.8", features = ["serde"] }
utoipa = { version = "6.0.0", features = ["time", "url"], optional = true }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"

[features]
default = ["keychain"]
# Store credentials in the OS keychain (desktop). Headless builds can use the file store.
keychain = ["dep:keyring"]
# Derive OpenAPI schemas for the HTTP API.
openapi = ["dep:utoipa"]
# JSON Schema for provider definitions.
schema = ["dep:schemars"]
# Built-in Tor (Arti).
tor = ["dep:arti-client", "dep:tor-rtcompat"]
