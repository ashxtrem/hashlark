[package]
name = "hashlark-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
data-encoding = "2.11.1"
futures-core = "0.3.34"
getrandom = "0.4.3"
governor = "0.10.4"
hashlark-core = { version = "0.1.1", path = "../hashlark-core", features = ["keychain", "openapi", "tor"], default-features = false }
mime_guess = "2.0.5"
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
subtle = "2.6.1"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tokio-stream = "0.1.19"
toml = "1.1.6"
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"
utoipa = "6.0.0"
utoipa-axum = "0.3.0"

[lints]
workspace = true

[dev-dependencies]
async-trait = "0.1.92"
http-body-util = "0.1.5"
roxmltree = "0.21.1"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
