name: Provider canary

# Every night, run each first-party definition against its live site and
# open (or update) an issue when one breaks. Never blocks pull requests.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p hashlark-cli
      - name: Test each definition live
        id: run
        shell: bash
        run: |
          failed=""
          for def in definitions/builtin/*.yml; do
            echo "::group::$def"
            if ! ./target/release/hashlark-cli defs test "$def" --live; then
              failed="$failed $(basename "$def" .yml)"
            fi
            echo "::endgroup::"
          done
          echo "failed=${failed# }" >> "$GITHUB_OUTPUT"
      - name: Report broken providers
        if: steps.run.outputs.failed != ''
        uses: actions/github-script@v9
        env:
          FAILED: ${{ steps.run.outputs.failed }}
        with:
          script: |
            const title = 'Canary: provider definitions failing';
            const body = [
              `The nightly canary could not search: **${process.env.FAILED}**.`,
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Reproduce with `hashlark-cli defs test definitions/builtin/<id>.yml --live`.',
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'canary',
            });
            if (issues.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issues[0].number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['canary'] });
            }
