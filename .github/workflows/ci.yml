name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Linux build dependencies (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Desktop UI build (embedded by the Tauri crate)
        shell: bash
        run: |
          corepack enable
          cd apps/desktop && pnpm install --frozen-lockfile && pnpm build
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Test
        run: cargo test --workspace --exclude hashlark-desktop
      - name: Lint first-party definitions
        shell: bash
        run: cargo run -q -p hashlark-cli -- defs lint definitions/builtin/*.yml

  ui:
    name: Desktop UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  deny:
    name: Licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  android:
    name: Android (build, lint, unit tests)
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: 29.0.13599879
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;${{ env.ANDROID_NDK_VERSION }}"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint, unit tests and debug build (x86_64 keeps CI fast; the release job builds every ABI)
        working-directory: apps/android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}
        run: ./gradlew lint testDebugUnitTest assembleDebug -Phashlark.abis=x86_64 --stacktrace
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            apps/android/**/build/reports/
            apps/android/**/build/outputs/roborazzi/

  android-emulator:
    name: Android emulator (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 26 and 28 cover Android 8 and 9 (the "Save as" path and no dark-mode support); 36 is the target.
        api: [26, 28, 36]
    env:
      ANDROID_NDK_VERSION: 29.0.13599879
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-emulator
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;${{ env.ANDROID_NDK_VERSION }}"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          working-directory: apps/android
          script: ./gradlew connectedDebugAndroidTest -Phashlark.abis=x86_64 --stacktrace

