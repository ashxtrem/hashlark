name: Release

# Push a tag like v1.0.0 to build and publish a draft release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, args: "" }
          - { name: macOS (Apple silicon), os: macos-latest, args: "--target aarch64-apple-darwin" }
          - { name: macOS (Intel), os: macos-latest, args: "--target x86_64-apple-darwin" }
          - { name: Linux, os: ubuntu-22.04, args: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.args, 'x86_64-apple') && 'x86_64-apple-darwin' || contains(matrix.args, 'aarch64-apple') && 'aarch64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs update packages (see docs/releasing.md).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Do not pass empty Apple signing variables. Tauri treats them as
          # "sign this build" and the macOS bundle fails before a DMG is produced.
          # When the secrets in docs/releasing.md exist, add them here.
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Hashlark ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for what changed.
          releaseDraft: true
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  server:
    name: Server (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the web UI (embedded in the server)
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Build
        run: cargo build --release --locked -p hashlark-server --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=hashlark-server-${{ github.ref_name }}-${{ matrix.target }}
          mkdir "$name"
          cp LICENSE README.md docs/deploy/hashlark.example.toml docs/deploy/hashlark.service "$name/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp target/${{ matrix.target }}/release/hashlark-server.exe "$name/"
            7z a "$name.zip" "$name" >/dev/null
          else
            cp target/${{ matrix.target }}/release/hashlark-server "$name/"
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: hashlark-server-*.*

  android:
    name: Android (signed APKs)
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: 29.0.13599879
    steps:
      - uses: actions/checkout@v4
      - name: The tag must match the version in Cargo.toml
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [[ "${GITHUB_REF_NAME#v}" != "$version" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-release
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;${{ env.ANDROID_NDK_VERSION }}"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore the release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "The ANDROID_KEYSTORE_BASE64 secret is not set (see docs/releasing.md)." >&2
            exit 1
          fi
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/hashlark-release.jks"
      - name: Build the signed APKs (one per ABI plus a universal one)
        working-directory: apps/android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/hashlark-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace
      - name: Name, verify and fingerprint the APKs
        shell: bash
        run: |
          mkdir out
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            cp "apps/android/app/build/outputs/apk/release/app-${abi}-release.apk" "out/hashlark-${VERSION}-${abi}.apk"
          done
          apksigner="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          {
            echo "## Android signing certificate"
            echo
            echo '```'
            "${apksigner}" verify --print-certs -v "out/hashlark-${VERSION}-universal.apk" | grep -E "Verifies|Verified using|certificate SHA-256 digest"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          for apk in out/*.apk; do "${apksigner}" verify "$apk"; done
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: out/hashlark-*.apk

  checksums:
    name: SHA256SUMS
    needs: [desktop, server, android]
    runs-on: ubuntu-latest
    steps:
      - name: Checksums of every file attached to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          id=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq ".[] | select(.tag_name==\"${TAG}\") | .id" | head -n1)
          test -n "$id"
          mkdir assets && cd assets
          gh api "repos/${GITHUB_REPOSITORY}/releases/${id}/assets" --paginate --jq '.[] | select(.name != "SHA256SUMS") | "\(.id) \(.name)"' |
          while read -r asset_id name; do
            gh api -H "Accept: application/octet-stream" "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > "${name}"
          done
          sha256sum -- * > ../SHA256SUMS
          cat ../SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: SHA256SUMS

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
