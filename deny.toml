# cargo-deny policy. Hashlark is GPL-3.0-or-later, so every dependency must
# be under a GPL-3.0-compatible licence. See docs/adr/0011-licence-gpl-3.md.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Unmaintained (not vulnerable) proc-macro crate used at build time by
    # gtk-rs, which Tauri needs on Linux. Nothing to upgrade to until Tauri
    # moves off gtk 0.18.
    { id = "RUSTSEC-2024-0370", reason = "build-time only, via Tauri's Linux GTK stack" },
    # Timing side channel in RSA *private-key* operations. It reaches us via
    # Arti's key handling; as a Tor client Hashlark performs no RSA
    # private-key operations, and no fixed `rsa` release exists yet.
    { id = "RUSTSEC-2023-0071", reason = "no RSA private-key operations in a Tor client; no fixed release" },
    # Unmaintained build-time macro crate used by Arti; not a vulnerability.
    { id = "RUSTSEC-2024-0436", reason = "build-time macro via Arti; no replacement upstream yet" },
    # Bundled SQLite < 3.54 can return uninitialised page-cache memory when it
    # opens a crafted database + `-wal` pair. The fix is libsqlite3-sys 0.39,
    # but sqlx-sqlite 0.9.0 (the latest sqlx) caps it at <0.38, and
    # `links = "sqlite3"` allows one version in the graph, so Arti's rusqlite
    # is held back too. Hashlark only opens its own database in its app-data
    # directory, never a file a less trusted party wrote. Drop this once sqlx
    # accepts libsqlite3-sys 0.39.
    { id = "RUSTSEC-2026-0459", reason = "fix blocked by sqlx 0.9 capping libsqlite3-sys <0.38; we only open our own database" },
    # Unmaintained (not vulnerable) build-time template config parser, used by
    # askama inside uniffi_bindgen to generate the Android bindings. The
    # latest askama and uniffi still depend on it.
    { id = "RUSTSEC-2026-0374", reason = "build-time only, via uniffi_bindgen/askama; no replacement upstream yet" },
    # zvariant, zvariant_derive and zbus_names are unmaintained (not
    # vulnerable): they were folded into zbus 6. They reach us on Linux via
    # zbus 4 (keyring's secret-service store) and zbus 5 (Tauri's opener and
    # single-instance plugins). No stable keyring or Tauri plugin release is
    # on zbus 6 yet.
    { id = "RUSTSEC-2026-0370", reason = "Linux D-Bus stack via keyring and Tauri plugins; no zbus 6 release of them yet" },
    { id = "RUSTSEC-2026-0371", reason = "Linux D-Bus stack via keyring and Tauri plugins; no zbus 6 release of them yet" },
    { id = "RUSTSEC-2026-0372", reason = "Linux D-Bus stack via keyring and Tauri plugins; no zbus 6 release of them yet" },
    # ringbuf 0.4 `Consumer::skip`/`clear` double-drop when an element's
    # `Drop` panics. It reaches us via librqbit-utp 0.7 (librqbit's uTP),
    # which pins ringbuf 0.4 and only stores `u8` in it (`SharedRb<Heap<u8>>`),
    # whose drop cannot panic. Drop this once librqbit-utp moves to ringbuf 0.5.2+.
    { id = "RUSTSEC-2026-0293", reason = "librqbit-utp stores only u8 in ringbuf; u8 drop cannot panic; no ringbuf 0.4 fix" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# The allow-list covers dependencies planned for later milestones too.
unused-allowed-license = "allow"
allow = [
    "GPL-3.0-or-later",   # Hashlark's own crates
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",          # public-domain dedication (GPL-compatible), via Arti
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
