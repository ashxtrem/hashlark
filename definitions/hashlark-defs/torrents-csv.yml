schema: 1
id: torrents-csv
name: Torrents.csv
description: Open, community-maintained DHT torrent index
language: en
version: 1
links:
  - https://torrents-csv.com/
search:
  path: service/search
  params:
    q: "{{ query.text }}"
    size: "100"
  response: json
  rows: "$.torrents[*]"
  fields:
    title:
      path: "$.name"
    info_hash:
      path: "$.infohash"
    size:
      path: "$.size_bytes"
      optional: true
    seeders:
      path: "$.seeders"
      optional: true
    leechers:
      path: "$.leechers"
      optional: true
    date:
      path: "$.created_unix"
      optional: true
test:
  query: ubuntu
